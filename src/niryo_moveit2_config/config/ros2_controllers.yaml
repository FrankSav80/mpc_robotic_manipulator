#      - joint_2
#      - joint_3
#      - joint_4
#      - joint_5
#      - joint_6
#    interface_name: velocity

niryo_velocity_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
